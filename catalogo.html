<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo - JFK First System</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#0a2a43;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#12395c;
padding:10px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

h2{
text-align:center;
color:#0a2a43;
margin-top:40px;
}

.catalogo{
width:90%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
padding:30px 0;
}

.producto{
background:white;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
text-align:center;
padding:15px;
}

.producto img{
width:100%;
height:200px;
object-fit:contain;
background:#f8f8f8;
padding:10px;
border-radius:6px;
}

.producto h3{
margin:10px 0;
}

.producto p{
font-size:14px;
}

.btn{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
}

footer{
background:#0a2a43;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<h1>Catálogo de Productos</h1>
</header>

<nav>
<a href="index.html">Inicio</a>
<a href="catalogo.html">Catálogo</a>
</nav>

<h2>Equipos</h2>
<div style="text-align:center; margin:20px;">
<input type="text" id="buscador" placeholder="Buscar producto..." 
onkeyup="buscarProducto()" 
style="padding:10px; width:250px; border-radius:6px; border:1px solid #ccc;">
</div>

<div id="catalogo"></div>
<div id="catalogo" class="catalogo-grid"></div>
<script>

fetch("camaras.xml")
.then(response => response.text())
.then(data => {

const parser = new DOMParser();
const xml = parser.parseFromString(data,"text/xml");

const productos = xml.getElementsByTagName("producto");

for(let i=0;i<productos.length;i++){

let titulo = productos[i].getElementsByTagName("titulo")[0].textContent;
let precio = productos[i].getElementsByTagName("su_precio")[0].textContent;
let imagen = productos[i].getElementsByTagName("url_imagen")[0].textContent;
let marca = productos[i].getElementsByTagName("marca")[0].textContent;
let stock = productos[i].getElementsByTagName("existencia")[0].textContent;

document.getElementById("catalogo").innerHTML += `

<div class="producto item">

<img src="${imagen}">

<h3>${titulo}</h3>

<p><strong>Marca:</strong> ${marca}</p>

<p><strong>PRECIO: $${precio}</strong></p>

<p><strong>Stock:</strong> ${stock}</p>

<p style="font-size:12px;color:#666;">
*Precio y disponibilidad sujetos a stock
</p>

<a class="btn"
href="https://wa.me/5218124199535?text=Hola%20me%20interesa%20${titulo}"
target="_blank">
Consultar
</a>

</div>

`;

}

});

</script>
</div>

<footer>
© 2026 JFK First System
</footer>

</body>

</html>
