<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo - JFK First System</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#0a2a43;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#12395c;
padding:10px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

h2{
text-align:center;
color:#0a2a43;
margin-top:40px;
}

.catalogo{
width:90%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:30px 0;
}

.producto{
background:white;
border-radius:8px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
text-align:center;
}

.producto img{
width:100%;
height:180px;
object-fit:contain;
}

.producto h3{
margin:10px 0;
}

.producto p{
font-size:14px;
}

.btn{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
}

footer{
background:#0a2a43;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<h1>Catálogo de Productos</h1>
</header>

<nav>
<a href="index.html">Inicio</a>
<a href="catalogo.html">Catálogo</a>
</nav>

<h2>Equipos</h2>
<div style="text-align:center; margin:20px;">
<input type="text" id="buscador" placeholder="Buscar producto..." 
onkeyup="buscarProducto()" 
style="padding:10px; width:250px; border-radius:6px; border:1px solid #ccc;">
</div>

<div id="catalogo"></div>
<div id="catalogo" class="catalogo"></div>

<div class="paginacion">
<button onclick="paginaAnterior()">Anterior</button>
<span id="numeroPagina"></span>
<button onclick="paginaSiguiente()">Siguiente</button>
</div>
<script>

let productos = [];
let pagina = 1;
let productosPorPagina = 20;

fetch("camaras.xml")
.then(res => res.text())
.then(data => {

const parser = new DOMParser();
const xml = parser.parseFromString(data,"text/xml");

productos = Array.from(xml.getElementsByTagName("producto"));

mostrarPagina();

});

function mostrarPagina(){

let catalogo = document.getElementById("catalogo");
catalogo.innerHTML = "";

let inicio = (pagina-1)*productosPorPagina;
let fin = inicio + productosPorPagina;

let productosPagina = productos.slice(inicio,fin);

productosPagina.forEach(p=>{

let titulo = p.getElementsByTagName("titulo")[0].textContent;
let precio = p.getElementsByTagName("su_precio")[0].textContent;
let imagen = p.getElementsByTagName("url_imagen")[0].textContent;
let marca = p.getElementsByTagName("marca")[0].textContent;

catalogo.innerHTML += `

<div class="producto">

<img src="${imagen}" loading="lazy">

<h3>${titulo}</h3>

<p>${marca}</p>

<p><strong>$${precio}</strong></p>

<p style="font-size:12px;color:#666;">
*Precio y disponibilidad sujetos a stock
</p>

<a href="https://wa.me/5218124199535?text=Hola me interesa ${titulo}" target="_blank">
Consultar
</a>

</div>

`;

});

document.getElementById("numeroPagina").innerText = "Página " + pagina;

}

function paginaSiguiente(){

if(pagina*productosPorPagina < productos.length){

pagina++;
mostrarPagina();

}

}

function paginaAnterior(){

if(pagina>1){

pagina--;
mostrarPagina();

}

}

</script>
</div>

<footer>
© 2026 JFK First Syste
</footer>

</body>

</html>
