<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo - JFK First System</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#0a2a43;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#12395c;
padding:10px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

h2{
text-align:center;
color:#0a2a43;
margin-top:40px;
}

.buscador{
width:90%;
max-width:1200px;
margin:auto;
text-align:center;
margin-top:30px;
}

#busqueda{
width:60%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

.catalogo{
width:90%;
max-width:1300px;
margin:auto;
display:grid;
grid-template-columns:repeat(4, 1fr);
gap:20px;
padding:30px 0;
}

.producto{
background:white;
border-radius:8px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
text-align:center;
}

.producto img{
width:100%;
height:180px;
object-fit:contain;
}

.producto h3{
margin:10px 0;
}

.producto p{
font-size:14px;
}

.btn{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
}

footer{
background:#0a2a43;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

.paginacion{
text-align:center;
margin:30px 0;
}

.paginacion span,
.paginacion button{
display:inline-block;
margin:5px;
padding:8px 12px;
background:#12395c;
color:white;
border-radius:5px;
cursor:pointer;
}

.paginacion span.activa{
background:#25D366;
}

</style>
</head>

<body>

<header>
<h1>Catálogo de Productos</h1>
</header>

<nav>
<a href="index.html">Inicio</a>
<a href="catalogo.html">Catálogo</a>
</nav>

<h2>Equipos</h2>
<div style="text-align:center; margin:20px;">
<div class="buscador">
<input type="text" id="busqueda" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
</div>

<div id="catalogo" class="catalogo"></div>

<div class="paginacion" id="paginacion"></div>

<script>

let productos = [];
let pagina = 1;
let productosPorPagina = 20;

fetch("camaras.xml")
.then(res => res.text())
.then(data => {

const parser = new DOMParser();
const xml = parser.parseFromString(data,"text/xml");

productos = Array.from(xml.getElementsByTagName("producto"));

mostrarPagina();

});

function mostrarPagina(){
function crearPaginacion(){

let totalPaginas = Math.ceil(productos.length / productosPorPagina);

let paginacion = document.getElementById("paginacion");

paginacion.innerHTML = "";

paginacion.innerHTML += `<button onclick="paginaAnterior()"><</button>`;

for(let i=1;i<=totalPaginas;i++){

paginacion.innerHTML += `
<span class="${i==pagina ? 'activa' : ''}" onclick="irPagina(${i})">
${i}
</span>
`;

}

paginacion.innerHTML += `<button onclick="paginaSiguiente()">></button>`;

}
function irPagina(num){

pagina = num;

mostrarPagina();

}

let catalogo = document.getElementById("catalogo");
catalogo.innerHTML = "";

let inicio = (pagina-1)*productosPorPagina;
let fin = inicio + productosPorPagina;

let productosPagina = productos.slice(inicio,fin);

productosPagina.forEach(p=>{

let titulo = p.getElementsByTagName("titulo")[0].textContent;
let precioUSD = parseFloat(p.getElementsByTagName("precio_lista_usd")[0].textContent);
let imagen = p.getElementsByTagName("url_imagen")[0].textContent;
let marca = p.getElementsByTagName("marca")[0].textContent;

let tipoCambio = 17.78;
let precioMXN = precioUSD * tipoCambio;
let precioFinal = (precioMXN * 1.16).toFixed(2);

catalogo.innerHTML += `

<div class="producto">

<img src="${imagen}" loading="lazy">

<h3>${titulo}</h3>

<p>${marca}</p>

<p><strong>$${precioFinal} MXN</strong></p>

<p style="font-size:12px;color:#666;">
*Precio y disponibilidad sujetos a stock
</p>

<a href="https://wa.me/5218124199535?text=Hola me interesa ${titulo}" target="_blank">
Consultar
</a>

</div>

`;

});

crearPaginacion();

}

function paginaSiguiente(){

if(pagina*productosPorPagina < productos.length){

pagina++;
mostrarPagina();

}

}

function paginaAnterior(){

if(pagina>1){

pagina--;
mostrarPagina();

}

}

</script>
<script>

function filtrarProductos(){

let input = document.getElementById("busqueda").value.toLowerCase();

let listaProductos = document.querySelectorAll(".producto");

listaProductos.forEach(function(producto){

let texto = producto.textContent.toLowerCase();

if(texto.includes(input)){
producto.style.display="";
}else{
producto.style.display="none";
}

});

}

</script>
</div>

<footer>
© 2026 JFK First System
</footer>

</body>

</html>
